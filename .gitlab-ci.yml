variables:
  NODE_OPTIONS: '--max-old-space-size=4096'

default:
  tags:
    - exec-docker
  image: node:25-alpine

stages:
  - code-analysis
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

linting:
  stage: code-analysis
  before_script:
    - node --version
    - npm install -g pnpm
    - pnpm --version
    - pnpm install --frozen-lockfile
  script:
    - pnpm run lint
    - pnpm run format:check
  artifacts:
    expire_in: 1h
    paths:
      - node_modules

test:
  stage: test
  before_script:
    - node --version
    - npm install -g pnpm
    - pnpm --version
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:coverage
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
      - node_modules

build:
  stage: build
  before_script:
    - node --version
    - npm install -g pnpm
  variables:
    VERSION_TAG: $CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA
  script:
    - pnpm vite build
  artifacts:
    expire_in: 1h
    paths:
      - node_modules
      - dist
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
